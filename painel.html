DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Médico - Agendamentos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
    h1 { color: #0056b3; }
    table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #0056b3; color: white; }
    .status-pendente { color: #d9534f; font-weight: bold; }
    .status-confirmada { color: #5cb85c; font-weight: bold; }
    .btn-confirmar { background-color: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    .btn-confirmar:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Painel da Equipe de Saúde</h1>
  <p>Gestão e confirmação de consultas pendentes.</p>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Paciente</th>
        <th>Data</th>
        <th>Horário</th>
        <th>Especialidade</th>
        <th>Status</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="tabela-consultas">
      <!-- Inserido dinamicamente via JS -->
    </tbody>
  </table>

  <script>
    const API_URL = 'http://localhost:3000/api/consultas';

    // Carrega as consultas do Back-End
    async function carregarConsultas() {
      const res = await fetch(API_URL);
      const consultas = await res.json();
      
      const tbody = document.getElementById('tabela-consultas');
      tbody.innerHTML = '';

      consultas.forEach(c => {
        const tr = document.createElement('tr');
        const ePendente = c.status === 'Pendente';

        tr.innerHTML = `
          <td>${c.id}</td>
          <td>${c.paciente}</td>
          <td>${c.data}</td>
          <td>${c.horario}</td>
          <td>${c.especialidade}</td>
          <td class="${ePendente ? 'status-pendente' : 'status-confirmada'}">${c.status}</td>
          <td>
            <button 
              class="btn-confirmar" 
              onclick="confirmarConsulta(${c.id})" 
              ${!ePendente ? 'disabled' : ''}>
              ${ePendente ? 'Confirmar Atendimento' : 'Atendimento Confirmado'}
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Altera o status para 'Confirmada' via API
    async function confirmarConsulta(id) {
      const res = await fetch(`${API_URL}/${id}/confirmar`, {
        method: 'PATCH'
      });

      if (res.ok) {
        carregarConsultas(); // Recarrega a tabela com o novo status
      } else {
        alert("Erro ao confirmar consulta.");
      }
    }

    // Inicializa a tabela
    carregarConsultas();
  </script>
</body>
</html>
